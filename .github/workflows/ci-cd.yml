name: Multi-Container CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product-catalog-backend:latest -t ${{ secrets.DOCKER_USERNAME }}/product-catalog-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/product-catalog-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/product-catalog-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product-catalog-frontend:latest -t ${{ secrets.DOCKER_USERNAME }}/product-catalog-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/product-catalog-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/product-catalog-frontend:${{ github.sha }}

      - name: Build and push nginx image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product-catalog-nginx:latest -t ${{ secrets.DOCKER_USERNAME }}/product-catalog-nginx:${{ github.sha }} ./nginx
          docker push ${{ secrets.DOCKER_USERNAME }}/product-catalog-nginx:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/product-catalog-nginx:${{ github.sha }}

  # Deployment job — documented but not active.
  # Requires a provisioned server with Docker, Docker Compose, and this repo cloned.
  # Enable by removing the `if: false` condition and configuring the required secrets:
  #   VM_HOST, VM_USER, VM_SSH_KEY
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: false

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/product-catalog-devops
            bash deploy.sh